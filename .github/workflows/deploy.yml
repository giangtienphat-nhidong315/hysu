name: Triển khai Ứng Dụng lên GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt thư viện (Install)
        run: npm ci

      - name: Đóng gói ứng dụng (Build)
        run: npm run build

      - name: Thiết lập GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải bản build lên Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Xuất bản lên GitHub Pages (Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
